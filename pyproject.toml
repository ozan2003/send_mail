[project]
name = "send-mail"
version = "0.1.0"
description = "Script to send CV emails"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
    # Core & Style
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "YTT",
    "Q",
    "COM",
    "ISC",
    # Docstrings
    "D",
    "FLY",
    # Typing & Annotations
    "ANN",
    "FA",
    "TC",
    # Correctness & Bugs
    "B",
    "A",
    "C4",
    "PIE",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "INT",
    "SLF",
    # Performance & Modernization
    "PERF",
    "FURB",
    "SLOT",
    # Safety, Exceptions & Quality
    "S",
    "BLE",
    "TRY",
    "EM",
    "RSE",
    "ASYNC",
    "DTZ",
    "T10",
    "PGH",
    "ERA",
    "EXE",
    "ICN",
    "LOG",
    "G",
    "FBT",
    # Pylint
    "PL",
    # Ruff Specific
    "RUF",
]
ignore = [
    "E501",
    "ISC001",
    "COM812",
    "ANN401",  # use Any in **kwargs
    "PLR0911", # many early returns in retry state machines
    "PLR0912", # many branches in retry state machines
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "S311",
    "D107",    # init docstrings are documented at class level
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["D", "S101", "SLF001", "ANN001", "ANN201", "ANN202", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-none-returning = true

[tool.pyright]
include = ["send_cv_mail.py"]
typeCheckingMode = "strict"

# Environment
pythonVersion = "3.14"
deprecateTypingAliases = true

# Rules that default to "none" in strict mode
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportImportCycles = "error"
reportMissingSuperCall = "error"
reportPropertyTypeMismatch = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"
